# intraHouse: вход под локальными учетными записями (логин + пароль) только из своих сетей.
# Свои сети - переменная $ih_local_login из geo (см. intrahouse-site.conf).
# Снаружи остаются: вход через Keycloak (method authkck) и восстановление сеанса по токену
# (method auth без username). Подключать в location для /api/user и /api/admin.
client_max_body_size 64k;
client_body_buffer_size 64k;
access_by_lua_block {
    if ngx.var.ih_local_login == "1" or ngx.req.get_method() ~= "POST" then
        return
    end

    local function deny(reason)
        ngx.log(ngx.WARN, "ih local login denied: ", reason, " from ", ngx.var.remote_addr)
        ngx.status = 200
        ngx.header["Content-Type"] = "application/json; charset=utf-8"
        ngx.say('{"response":0,"message":"Вход по паролю доступен только из домашней сети. Войдите через Keycloak."}')
        return ngx.exit(200)
    end

    local args = ngx.req.get_uri_args()
    if args.username or args.password or args.method then
        return deny("query args")
    end

    ngx.req.read_body()
    local body = ngx.req.get_body_data()
    if not body then
        -- пустое тело или тело ушло во временный файл: для /api/user так не бывает
        if ngx.req.get_body_file() then return deny("body in file") end
        return
    end

    local data = require("cjson.safe").decode(body)
    if type(data) ~= "table" then
        return deny("not json")
    end
    if data.method == "auth" and (data.username ~= nil or data.password ~= nil or data.pbx ~= nil) then
        return deny("password auth")
    end
}
