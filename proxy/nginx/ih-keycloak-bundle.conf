# intraHouse + Keycloak: правки бандла интерфейса при отдаче - подключать в location для main.*.chunk.js
# 1. Вход через Keycloak учитывает «Запомнить меня» (интерфейс не передает rememberme).
# 2. Вход в том же окне вместо всплывающего: данные PKCE кладутся в sessionStorage,
#    вкладка уходит на Keycloak, возврат принимает kc-callback.html (/auth/keycloak).
proxy_set_header Accept-Encoding "";
sub_filter_types application/javascript;
sub_filter_once on;
sub_filter 'keycloak:t.data.code,verifier:e.codeVerifier}' 'keycloak:t.data.code,verifier:e.codeVerifier,rememberme:e.state.rememberme}';
sub_filter 'a.keycloakPopup=window.open(o,"keycloak-login",' 'a.keycloakPopup=(function(u,c){try{sessionStorage.setItem("kc_verifier",c.codeVerifier);sessionStorage.setItem("kc_api","admin"===h.a.options.type?"/api/admin":"/api/user");sessionStorage.setItem("kc_return",location.pathname+location.search)}catch(x){}location.assign(u);return null})(o,a,';
