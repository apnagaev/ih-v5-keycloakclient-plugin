# В server-блок Keycloak (например, sso.example.com), если realm не называется intrascada:
# интерфейс intraHouse открывает /realms/intrascada/... - перенаправляем на свой realm.
location = /realms/intrascada/protocol/openid-connect/auth {
    return 302 /realms/<realm>/protocol/openid-connect/auth$is_args$args;
}

# Если перед Keycloak выставляется Cross-Origin-Opener-Policy, для страниц входа нужно
# unsafe-none (иначе ломается вход во всплывающем окне):
#   add_header Cross-Origin-Opener-Policy "unsafe-none" always;
