# Пример: intraHouse за nginx/OpenResty с входом через Keycloak.
# Замените ih.example.com, адрес бэкенда, сети, пути к сертификатам и к файлам из proxy/
# (здесь: snippets/ - файлы из proxy/nginx, static/ - файлы из proxy/static).
# В блоках с add_header повторите свои заголовки безопасности: add_header внутри
# location отменяет add_header уровня server.

# Свои сети: отсюда разрешен вход под локальными учетными записями (ih-local-login.conf).
# Добавьте домашнюю сеть, подсеть VPN и внешний адрес дома.
geo $ih_local_login {
    default         0;
    192.168.0.0/16  1;
    10.0.0.0/8      1;
}

upstream intrahouse_backend {
    server 127.0.0.1:8088;
}

server {
    listen 443 ssl;
    server_name ih.example.com;

    ssl_certificate     /etc/nginx/ssl/ih.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ih.example.com.key;

    # Страница возврата из Keycloak (proxy/static/kc-callback.html).
    # COOP unsafe-none: если страница открыта всплывающим окном, ей нужен window.opener.
    location = /auth/keycloak {
        default_type text/html;
        alias /etc/nginx/static/kc-callback.html;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cache-Control "no-store" always;
    }

    # Вход (интерфейс и админка): снаружи - только через Keycloak.
    # Регулярка без учета регистра и со слэшем на конце: Express принимает и /API/User/.
    location ~* ^/api/(user|admin)/?$ {
        include /etc/nginx/snippets/ih-local-login.conf;
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
    }

    # Приложение (PWA): свой манифест с именем и иконками 192/512
    location = /manifest.json {
        default_type application/manifest+json;
        alias /etc/nginx/static/ih-manifest.json;
    }
    location ~ ^/(ih-icon-192|ih-icon-512|ih-icon-maskable-512|ih-apple-touch-icon)\.png$ {
        default_type image/png;
        alias /etc/nginx/static/$1.png;
        expires 7d;
    }

    # Бандл интерфейса: вход в том же окне и учет «Запомнить меня»
    location ~ ^/static/js/main\.[0-9a-f]+\.chunk\.js$ {
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/ih-keycloak-bundle.conf;
    }

    location / {
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # sub_filter в ih-pwa-head.conf работает только с несжатым ответом бэкенда
        proxy_set_header Accept-Encoding "";
        include /etc/nginx/snippets/ih-pwa-head.conf;
    }

    location ^~ /admin {
        # allow 192.168.0.0/16; deny all;   # по желанию: админка только из своей сети
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Бандл админки (allow/deny наследуются)
        location ~ ^/admin/static/js/main\.[0-9a-f]+\.chunk\.js$ {
            proxy_pass http://intrahouse_backend;
            proxy_set_header Host $host;
            include /etc/nginx/snippets/ih-keycloak-bundle.conf;
        }
    }
}
