# Пример: intraHouse за nginx/OpenResty с входом через Keycloak.
# Замените ih.example.com, адрес бэкенда, пути к сертификатам и к файлам из proxy/.
# В блоках с add_header повторите свои заголовки безопасности: add_header внутри
# location отменяет add_header уровня server.

upstream intrahouse_backend {
    server 127.0.0.1:8088;
}

server {
    listen 443 ssl;
    server_name ih.example.com;

    ssl_certificate     /etc/nginx/ssl/ih.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ih.example.com.key;

    # Страница возврата из Keycloak (proxy/static/kc-callback.html).
    # COOP unsafe-none: если страница открыта всплывающим окном, ей нужен window.opener.
    location = /auth/keycloak {
        default_type text/html;
        alias /etc/nginx/static/kc-callback.html;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cache-Control "no-store" always;
    }

    # Бандл интерфейса: вход в том же окне и учет «Запомнить меня»
    location ~ ^/static/js/main\.[0-9a-f]+\.chunk\.js$ {
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/ih-keycloak-bundle.conf;
    }

    location / {
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /admin {
        # allow 192.168.0.0/16; deny all;   # по желанию: админка только из своей сети
        proxy_pass http://intrahouse_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Бандл админки (allow/deny наследуются)
        location ~ ^/admin/static/js/main\.[0-9a-f]+\.chunk\.js$ {
            proxy_pass http://intrahouse_backend;
            proxy_set_header Host $host;
            include /etc/nginx/snippets/ih-keycloak-bundle.conf;
        }
    }
}
